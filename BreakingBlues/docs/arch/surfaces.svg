<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E7D6"/><stop offset="1" stop-color="#D9DEEE"/></linearGradient>
    <linearGradient id="snv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3E6B"/><stop offset="1" stop-color="#20305A"/></linearGradient>
    <linearGradient id="sac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3B45C"/><stop offset="1" stop-color="#EFA14C"/></linearGradient>
    <filter id="ssh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1A2440" flood-opacity="0.18"/></filter>
    <marker id="sar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B77A6"/></marker>
  </defs>
  <rect width="1120" height="640" fill="url(#sbg)"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#1F2A4A">Breaking Blues — Surface Map &amp; Navigation</text>
  <text x="40" y="76" font-size="14" fill="#55608A">Hub-and-sheets (no tab bar). Splash → (first launch) Onboarding → Home. Sheets present over Home. Crisis is always reachable.</text>

  <!-- Splash -->
  <rect x="40" y="120" width="130" height="64" rx="14" fill="url(#snv)" filter="url(#ssh)"/>
  <text x="105" y="150" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Splash</text>
  <text x="105" y="169" font-size="11" fill="#C7D0EA" text-anchor="middle">launch · adaptive</text>

  <!-- Onboarding chain -->
  <rect x="210" y="104" width="360" height="96" rx="16" fill="#fff" filter="url(#ssh)"/>
  <text x="228" y="128" font-size="13" font-weight="700" fill="#3A4670">ONBOARDING · first launch · Feature.onboarding</text>
  <g font-size="11.5" fill="#fff">
    <rect x="228" y="138" width="100" height="46" rx="10" fill="url(#snv)"/><text x="278" y="158" text-anchor="middle">1 · Welcome</text><text x="278" y="174" text-anchor="middle">brand mark</text>
    <rect x="336" y="138" width="112" height="46" rx="10" fill="url(#snv)"/><text x="392" y="158" text-anchor="middle">2 · Channel-mode</text><text x="392" y="174" text-anchor="middle">soft / hard</text>
    <rect x="456" y="138" width="98" height="46" rx="10" fill="url(#snv)"/><text x="505" y="158" text-anchor="middle">3 · First</text><text x="505" y="174" text-anchor="middle">friend + import</text>
  </g>

  <!-- HOME hub -->
  <rect x="430" y="250" width="250" height="120" rx="18" fill="url(#sac)" filter="url(#ssh)"/>
  <text x="555" y="284" font-size="19" font-weight="700" fill="#1A2440" text-anchor="middle">HOME · hub</text>
  <text x="555" y="308" font-size="11.5" fill="#5A4620" text-anchor="middle">greeting · nudge · check-in · circle</text>
  <text x="555" y="326" font-size="11.5" fill="#5A4620" text-anchor="middle">toolbar: [ + add friend ] [ gear ]</text>
  <text x="555" y="350" font-size="11" fill="#7A2E1A" text-anchor="middle">footer → Crisis (always available)</text>

  <!-- sheets row -->
  <g font-size="12">
    <rect x="40"  y="430" width="150" height="70" rx="14" fill="url(#snv)" filter="url(#ssh)"/><text x="115" y="462" fill="#fff" font-weight="700" text-anchor="middle">Composer</text><text x="115" y="482" fill="#C7D0EA" font-size="10.5" text-anchor="middle">draft → send · 15 ch</text>
    <rect x="210" y="430" width="150" height="70" rx="14" fill="url(#snv)" filter="url(#ssh)"/><text x="285" y="462" fill="#fff" font-weight="700" text-anchor="middle">Reflections</text><text x="285" y="482" fill="#C7D0EA" font-size="10.5" text-anchor="middle">mood check-in</text>
    <rect x="380" y="430" width="150" height="70" rx="14" fill="url(#snv)" filter="url(#ssh)"/><text x="455" y="462" fill="#fff" font-weight="700" text-anchor="middle">Circle</text><text x="455" y="482" fill="#C7D0EA" font-size="10.5" text-anchor="middle">reverse-signal</text>
    <rect x="550" y="430" width="150" height="70" rx="14" fill="url(#snv)" filter="url(#ssh)"/><text x="625" y="462" fill="#fff" font-weight="700" text-anchor="middle">Settings</text><text x="625" y="482" fill="#C7D0EA" font-size="10.5" text-anchor="middle">language · privacy</text>
    <rect x="720" y="430" width="150" height="70" rx="14" fill="#7A2E3A" filter="url(#ssh)"/><text x="795" y="462" fill="#fff" font-weight="700" text-anchor="middle">Crisis</text><text x="795" y="482" fill="#F3C0C8" font-size="10.5" text-anchor="middle">safety · native</text>
  </g>

  <!-- second-level -->
  <g font-size="11">
    <rect x="40"  y="540" width="150" height="56" rx="12" fill="#EEF1F8" filter="url(#ssh)"/><text x="115" y="565" fill="#1A2440" font-weight="700" text-anchor="middle">Add / Edit Friend</text><text x="115" y="583" fill="#55608A" text-anchor="middle">channels · reorder</text>
    <rect x="550" y="540" width="150" height="56" rx="12" fill="#EEF1F8" filter="url(#ssh)"/><text x="625" y="565" fill="#1A2440" font-weight="700" text-anchor="middle">Friends list</text><text x="625" y="583" fill="#55608A" text-anchor="middle">manage · add</text>
    <rect x="720" y="540" width="150" height="56" rx="12" fill="#EEF1F8" filter="url(#ssh)"/><text x="795" y="571" fill="#1A2440" font-weight="700" text-anchor="middle">tel: 1177/90101/112</text>
  </g>

  <!-- arrows -->
  <g stroke="#6B77A6" stroke-width="2.4" fill="none">
    <path d="M170 152 H206" marker-end="url(#sar)"/>
    <path d="M390 200 C420 230 500 226 540 248" marker-end="url(#sar)"/>
    <path d="M105 184 C105 320 300 300 428 300" marker-end="url(#sar)" stroke-dasharray="5 4"/>
    <!-- home to sheets -->
    <path d="M470 370 C360 400 200 405 130 428" marker-end="url(#sar)"/>
    <path d="M520 372 C440 400 330 408 300 428" marker-end="url(#sar)"/>
    <path d="M560 372 C520 400 480 410 462 428" marker-end="url(#sar)"/>
    <path d="M600 372 C610 398 620 408 625 428" marker-end="url(#sar)"/>
    <path d="M640 360 C720 392 770 405 795 428" marker-end="url(#sar)"/>
    <!-- second level -->
    <path d="M115 500 V538" marker-end="url(#sar)"/>
    <path d="M625 500 V538" marker-end="url(#sar)"/>
    <path d="M795 500 V538" marker-end="url(#sar)"/>
  </g>
  <text x="250" y="300" font-size="10.5" fill="#8A93B5" transform="rotate(-6 250 300)">skip if onboarded</text>
  <text x="470" y="418" font-size="10" fill="#6B77A6">nudge</text>
  <text x="612" y="418" font-size="10" fill="#6B77A6">gear</text>

  <!-- cross links -->
  <path d="M285 430 C240 400 170 470 190 470" stroke="#EFA14C" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#sar)"/>
  <path d="M455 500 C430 520 250 500 190 476" stroke="#EFA14C" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#sar)"/>
  <text x="905" y="452" font-size="11" fill="#8A6A2A">— dashed: cross-links</text>
  <text x="905" y="470" font-size="11" fill="#8A6A2A">   (Reflections/Circle → Composer)</text>
</svg>
