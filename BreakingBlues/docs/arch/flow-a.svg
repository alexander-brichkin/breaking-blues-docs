<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E7D6"/><stop offset="1" stop-color="#D9DEEE"/></linearGradient>
    <linearGradient id="nv2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3E6B"/><stop offset="1" stop-color="#20305A"/></linearGradient>
    <linearGradient id="ac2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3B45C"/><stop offset="1" stop-color="#EFA14C"/></linearGradient>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1A2440" flood-opacity="0.16"/></filter>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B77A6"/></marker>
  </defs>
  <rect width="960" height="520" fill="url(#bg2)"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#1F2A4A">Social Bridge — Flow A (you send it, from your own messenger)</text>
  <text x="40" y="76" font-size="14" fill="#55608A">The wedge: on a low day, a ready-to-send message removes the hardest step — starting.</text>

  <!-- signals in -->
  <rect x="40" y="110" width="180" height="128" rx="16" fill="#fff" filter="url(#sh2)"/>
  <text x="56" y="136" font-size="13" font-weight="700" fill="#3A4670">TRIGGERS</text>
  <g font-size="12.5" fill="#1A2440">
    <rect x="56" y="146" width="148" height="26" rx="7" fill="#EEF1F8"/><text x="66" y="163">Nudge · "been a while"</text>
    <rect x="56" y="178" width="148" height="26" rx="7" fill="#EEF1F8"/><text x="66" y="195">Reflections · low trend</text>
    <rect x="56" y="210" width="148" height="26" rx="7" fill="#EEF1F8"/><text x="66" y="227">Circle · reach my circle</text>
  </g>

  <!-- draft -->
  <rect x="270" y="110" width="200" height="128" rx="16" fill="url(#nv2)" filter="url(#sh2)"/>
  <text x="288" y="138" font-size="15" font-weight="700" fill="#fff">Draft</text>
  <text x="288" y="162" font-size="12" fill="#C7D0EA">Situation × Tone</text>
  <text x="288" y="181" font-size="11.5" fill="#C7D0EA">18 templates · EN / SV · bilingual</text>
  <text x="288" y="205" font-size="11.5" fill="#F3B45C">/generate → offline fallback</text>
  <text x="288" y="224" font-size="11.5" fill="#C7D0EA">edit freely before sending</text>

  <!-- channels -->
  <rect x="520" y="96" width="230" height="230" rx="16" fill="#fff" filter="url(#sh2)"/>
  <rect x="520" y="96" width="230" height="40" rx="16" fill="url(#ac2)"/><rect x="520" y="116" width="230" height="20" fill="url(#ac2)"/>
  <text x="540" y="122" font-size="14" font-weight="700" fill="#1A2440">Channels · 15</text>
  <g font-size="11.5" fill="#1A2440">
    <rect x="540" y="150" width="190" height="70" rx="10" fill="#EAF6EE"/>
    <text x="552" y="170" font-weight="700" fill="#1E7A44">Tier 1 — prefill</text>
    <text x="552" y="188" fill="#2C6B45">Messages · WhatsApp · Telegram</text>
    <text x="552" y="205" fill="#2C6B45">Viber · LINE · Email</text>
    <rect x="540" y="228" width="190" height="82" rx="10" fill="#EEF1F8"/>
    <text x="552" y="248" font-weight="700" fill="#3A4670">Tier 3 — copy + open</text>
    <text x="552" y="266" fill="#55608A">Messenger · Instagram · Snapchat</text>
    <text x="552" y="283" fill="#55608A">Discord · Signal · X · WeChat</text>
    <text x="552" y="300" fill="#55608A">KakaoTalk · Reddit</text>
  </g>

  <!-- messenger + friend -->
  <rect x="800" y="150" width="128" height="60" rx="14" fill="url(#nv2)" filter="url(#sh2)"/>
  <text x="864" y="176" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Your</text>
  <text x="864" y="194" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">messenger</text>
  <circle cx="864" cy="270" r="34" fill="#F3B45C" filter="url(#sh2)"/>
  <text x="864" y="276" font-size="16" font-weight="700" fill="#1A2440" text-anchor="middle">Erik</text>
  <text x="864" y="322" font-size="11.5" fill="#55608A" text-anchor="middle">a friend</text>

  <!-- arrows -->
  <g stroke="#6B77A6" stroke-width="2.6" fill="none">
    <path d="M220 174 H266" marker-end="url(#a2)"/>
    <path d="M470 174 H516" marker-end="url(#a2)"/>
    <path d="M750 180 H796" marker-end="url(#a2)"/>
    <path d="M864 210 V232" marker-end="url(#a2)"/>
  </g>
  <text x="243" y="166" font-size="10" fill="#55608A" text-anchor="middle">build</text>
  <text x="493" y="166" font-size="10" fill="#55608A" text-anchor="middle">tap</text>

  <!-- consent / proof -->
  <rect x="40" y="300" width="430" height="150" rx="16" fill="#F2E9DC" filter="url(#sh2)"/>
  <text x="58" y="326" font-size="13" font-weight="700" fill="#7A5A2A">VERIFIED (unit + live)</text>
  <g font-size="12" fill="#1A2440">
    <text x="58" y="350">✓ 8 URL tests — exact deep link per channel</text>
    <text x="58" y="372">✓ &amp; = ? # / + encoded, never break the link</text>
    <text x="58" y="394">✓ Simulator: Messages opened, draft prefilled</text>
    <text x="58" y="416">✓ Per-friend channels · user-reorderable · saved</text>
    <text x="58" y="438">✓ Nothing auto-sends — the user always sends</text>
  </g>

  <text x="520" y="360" font-size="13" font-weight="700" fill="#3A4670">Why "send it yourself"?</text>
  <text x="520" y="384" font-size="12" fill="#55608A">A normal message, from you — no bot, no</text>
  <text x="520" y="402" font-size="12" fill="#55608A">third-party account for your friend, works with</text>
  <text x="520" y="420" font-size="12" fill="#55608A">the apps they already use. The silent server-</text>
  <text x="520" y="438" font-size="12" fill="#55608A">pushed reverse-signal (Circle) lands in Phase 2.</text>
</svg>
