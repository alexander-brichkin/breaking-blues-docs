<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E7D6"/><stop offset="1" stop-color="#D9DEEE"/></linearGradient>
    <linearGradient id="ac3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3B45C"/><stop offset="1" stop-color="#EFA14C"/></linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1A2440" flood-opacity="0.16"/></filter>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B77A6"/></marker>
  </defs>
  <rect width="960" height="520" fill="url(#bg3)"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#1F2A4A">Config-driven testbed — layered resolution &amp; A/B</text>
  <text x="40" y="76" font-size="14" fill="#55608A">Change copy, onboarding and experiments without an App Store release. Persona-agnostic.</text>

  <!-- resolution stack -->
  <text x="40" y="122" font-size="14" font-weight="700" fill="#3A4670">Template resolution — most-specific first</text>
  <g>
    <rect x="40" y="136" width="470" height="52" rx="12" fill="#1A2440" filter="url(#sh3)"/>
    <text x="60" y="160" font-size="14" font-weight="700" fill="#fff">1 · per-user override</text>
    <text x="60" y="178" font-size="11.5" fill="#C7D0EA">this person only · data/user_overrides.json</text>
    <rect x="40" y="196" width="470" height="52" rx="12" fill="#2E3E6B" filter="url(#sh3)"/>
    <text x="60" y="220" font-size="14" font-weight="700" fill="#fff">2 · per-profile override</text>
    <text x="60" y="238" font-size="11.5" fill="#C7D0EA">persona / Profile #1 (Hugo) · profile_overrides.json</text>
    <rect x="40" y="256" width="470" height="52" rx="12" fill="#4B5A86" filter="url(#sh3)"/>
    <text x="60" y="280" font-size="14" font-weight="700" fill="#fff">3 · default-for-everyone</text>
    <text x="60" y="298" font-size="11.5" fill="#DCE3F2">editable live · default_overrides.json</text>
    <rect x="40" y="316" width="470" height="52" rx="12" fill="#7C89AE" filter="url(#sh3)"/>
    <text x="60" y="340" font-size="14" font-weight="700" fill="#fff">4 · signed baseline</text>
    <text x="60" y="358" font-size="11.5" fill="#EEF1F8">Ed25519-signed · never mutated at runtime</text>
  </g>
  <path d="M525 162 C560 162 560 342 525 342" stroke="#6B77A6" stroke-width="2.4" fill="none" marker-end="url(#a3)"/>
  <text x="548" y="256" font-size="11" fill="#55608A" transform="rotate(90 548 256)" text-anchor="middle">falls through</text>

  <!-- editing -->
  <rect x="600" y="136" width="322" height="150" rx="16" fill="#fff" filter="url(#sh3)"/>
  <rect x="600" y="136" width="322" height="38" rx="16" fill="url(#ac3)"/><rect x="600" y="155" width="322" height="19" fill="url(#ac3)"/>
  <text x="620" y="161" font-size="14" font-weight="700" fill="#1A2440">Editing API · X-Admin-Token</text>
  <g font-size="12" fill="#1A2440">
    <text x="620" y="196">PUT /admin/templates/{id}</text><text x="838" y="196" fill="#55608A" font-size="11">default</text>
    <text x="620" y="220">PUT /admin/profiles/{p}/templates/{id}</text>
    <text x="620" y="244">PUT /admin/users/{u}/templates/{id}</text>
    <text x="620" y="268" fill="#7A2E3A">403 without token ✓ · signed baseline intact</text>
  </g>

  <!-- feature flags -->
  <rect x="600" y="302" width="322" height="150" rx="16" fill="#F2E9DC" filter="url(#sh3)"/>
  <text x="620" y="328" font-size="14" font-weight="700" fill="#7A5A2A">FeatureFlags — every feature killable</text>
  <g font-size="11.5" fill="#1A2440">
    <text x="620" y="352">friends · multiChannel · nudges · circle ·</text>
    <text x="620" y="370">reflections · onboarding · voiceEntry</text>
    <text x="620" y="396" fill="#55608A">Deterministic rollout — Bucket(userId, salt)</text>
    <text x="620" y="414" fill="#55608A">= SHA-256 % 100 · same user → same variant</text>
    <text x="620" y="438" font-weight="700" fill="#7A2E3A">Crisis (safety) is NEVER flagged / A/B-tested</text>
  </g>

  <text x="40" y="400" font-size="12" fill="#55608A">Verified end-to-end: user override wins over a</text>
  <text x="40" y="418" font-size="12" fill="#55608A">default edit; clearing it falls back to the</text>
  <text x="40" y="436" font-size="12" fill="#55608A">layer below; baseline signature stays valid.</text>
</svg>
