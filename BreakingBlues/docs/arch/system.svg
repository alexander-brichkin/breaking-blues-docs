<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E7D6"/><stop offset="1" stop-color="#D9DEEE"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3E6B"/><stop offset="1" stop-color="#20305A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3B45C"/><stop offset="1" stop-color="#EFA14C"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1A2440" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="620" fill="url(#bg)"/>
  <text x="40" y="52" font-size="27" font-weight="700" fill="#1F2A4A">Breaking Blues — System Architecture</text>
  <text x="40" y="78" font-size="14" fill="#55608A">Offline-first iOS client · config-driven backend · ships to TestFlight</text>

  <!-- CLIENT -->
  <rect x="36" y="100" width="592" height="404" rx="22" fill="#ffffff" filter="url(#sh)"/>
  <rect x="36" y="100" width="592" height="46" rx="22" fill="url(#accent)"/>
  <rect x="36" y="124" width="592" height="22" fill="url(#accent)"/>
  <text x="60" y="130" font-size="17" font-weight="700" fill="#1A2440">Client — iOS 26 · SwiftUI (Liquid Glass)</text>

  <!-- Surfaces -->
  <rect x="60" y="160" width="544" height="104" rx="14" fill="#EEF1F8"/>
  <text x="76" y="184" font-size="13" font-weight="700" fill="#3A4670">SURFACES</text>
  <g font-size="11.5" fill="#ffffff">
    <g><rect x="76"  y="194" width="80" height="44" rx="9" fill="url(#navy)"/><text x="116" y="213" text-anchor="middle">Splash</text><text x="116" y="228" text-anchor="middle">Onboarding</text></g>
    <g><rect x="162" y="194" width="58" height="44" rx="9" fill="url(#navy)"/><text x="191" y="221" text-anchor="middle">Home</text></g>
    <g><rect x="226" y="194" width="78" height="44" rx="9" fill="url(#navy)"/><text x="265" y="221" text-anchor="middle">Composer</text></g>
    <g><rect x="310" y="194" width="84" height="44" rx="9" fill="url(#navy)"/><text x="352" y="221" text-anchor="middle">Reflections</text></g>
    <g><rect x="400" y="194" width="54" height="44" rx="9" fill="url(#navy)"/><text x="427" y="221" text-anchor="middle">Circle</text></g>
    <g><rect x="460" y="194" width="66" height="44" rx="9" fill="url(#navy)"/><text x="493" y="221" text-anchor="middle">Settings</text></g>
    <g><rect x="532" y="194" width="64" height="44" rx="9" fill="#7A2E3A"/><text x="564" y="213" text-anchor="middle">Crisis</text><text x="564" y="228" text-anchor="middle">safety</text></g>
  </g>
  <text x="76" y="256" font-size="10.5" fill="#7C89AE">secondary sheets: Add / Edit Friend · Friends list (from Composer / Settings)</text>

  <!-- SDUI + Stores -->
  <rect x="60" y="270" width="266" height="104" rx="14" fill="#EEF1F8"/>
  <text x="76" y="294" font-size="13" font-weight="700" fill="#3A4670">SERVER-DRIVEN UI</text>
  <g font-size="12" fill="#1A2440">
    <rect x="76" y="304" width="112" height="26" rx="7" fill="#DCE3F2"/><text x="132" y="321" text-anchor="middle">ComponentView</text>
    <rect x="196" y="304" width="112" height="26" rx="7" fill="#DCE3F2"/><text x="252" y="321" text-anchor="middle">ActionRouter</text>
    <rect x="76" y="338" width="232" height="26" rx="7" fill="#DCE3F2"/><text x="192" y="355" text-anchor="middle">allow-listed actions · a11y metadata</text>
  </g>

  <rect x="338" y="270" width="266" height="104" rx="14" fill="#EEF1F8"/>
  <text x="354" y="294" font-size="13" font-weight="700" fill="#3A4670">STATE (@Observable)</text>
  <g font-size="11.5" fill="#1A2440">
    <rect x="354" y="304" width="118" height="26" rx="7" fill="#DCE3F2"/><text x="413" y="321" text-anchor="middle">FriendStore</text>
    <rect x="480" y="304" width="118" height="26" rx="7" fill="#DCE3F2"/><text x="539" y="321" text-anchor="middle">ReflectionsStore</text>
    <rect x="354" y="338" width="76" height="26" rx="7" fill="#DCE3F2"/><text x="392" y="355" text-anchor="middle">Channel</text>
    <rect x="438" y="338" width="80" height="26" rx="7" fill="#DCE3F2"/><text x="478" y="355" text-anchor="middle">Flags(A/B)</text>
    <rect x="526" y="338" width="72" height="26" rx="7" fill="#DCE3F2"/><text x="562" y="355" text-anchor="middle">i18n</text>
  </g>

  <!-- Engine -->
  <rect x="60" y="386" width="544" height="98" rx="14" fill="#F2E9DC"/>
  <text x="76" y="410" font-size="13" font-weight="700" fill="#7A5A2A">ENGINE — BreakingBluesEngine (Foundation-only SPM · CLI-testable)</text>
  <g font-size="12" fill="#1A2440">
    <rect x="76"  y="420" width="120" height="50" rx="9" fill="#fff"/><text x="136" y="442" text-anchor="middle">Component</text><text x="136" y="458" text-anchor="middle">(SDUI decode)</text>
    <rect x="204" y="420" width="120" height="50" rx="9" fill="#fff"/><text x="264" y="442" text-anchor="middle">Bucket</text><text x="264" y="458" text-anchor="middle">SHA-256 A/B</text>
    <rect x="332" y="420" width="130" height="50" rx="9" fill="#fff"/><text x="397" y="442" text-anchor="middle">EntityValidator</text><text x="397" y="458" text-anchor="middle">schema</text>
    <rect x="470" y="420" width="122" height="50" rx="9" fill="#fff"/><text x="531" y="442" text-anchor="middle">59 + 5 UI tests</text><text x="531" y="458" text-anchor="middle">all green ✓</text>
  </g>

  <!-- BACKEND -->
  <rect x="656" y="100" width="268" height="300" rx="22" fill="#ffffff" filter="url(#sh)"/>
  <rect x="656" y="100" width="268" height="46" rx="22" fill="url(#navy)"/>
  <rect x="656" y="124" width="268" height="22" fill="url(#navy)"/>
  <text x="676" y="129" font-size="14" font-weight="700" fill="#fff">Backend · FastAPI + shared modules</text>
  <g font-size="12.5" fill="#1A2440">
    <rect x="680" y="164" width="220" height="40" rx="9" fill="#EEF1F8"/><text x="694" y="182" font-weight="700">/generate</text><text x="694" y="197" font-size="11" fill="#55608A">layered templates (user→profile→default→base)</text>
    <rect x="680" y="212" width="220" height="40" rx="9" fill="#EEF1F8"/><text x="694" y="230" font-weight="700">/config · /screen</text><text x="694" y="245" font-size="11" fill="#55608A">Ed25519-signed, verified client-side</text>
    <rect x="680" y="260" width="220" height="40" rx="9" fill="#EEF1F8"/><text x="694" y="278" font-weight="700">/admin</text><text x="694" y="293" font-size="11" fill="#55608A">template editing · X-Admin-Token</text>
    <rect x="680" y="308" width="220" height="40" rx="9" fill="#EEF1F8"/><text x="694" y="326" font-weight="700">events_relay</text><text x="694" y="341" font-size="11" fill="#55608A">no-PII · PostHog EU</text>
    <rect x="680" y="356" width="220" height="32" rx="9" fill="#EEF1F8"/><text x="694" y="376" font-weight="700">/auth</text><text x="740" y="376" font-size="11" fill="#55608A">Sign in with Apple · session</text>
  </g>

  <!-- APPLE -->
  <rect x="656" y="416" width="268" height="88" rx="18" fill="#1A2440" filter="url(#sh)"/>
  <text x="680" y="446" font-size="15" font-weight="700" fill="#fff">Apple · Distribution</text>
  <text x="680" y="470" font-size="12" fill="#C7D0EA">App Store Connect</text>
  <text x="680" y="490" font-size="12" fill="#F3B45C">TestFlight · internal</text>

  <!-- arrows -->
  <g stroke="#8A93B5" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M628 250 H652"/>
    <path d="M628 300 H652"/>
  </g>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8A93B5"/></marker></defs>
  <path d="M790 400 V416" stroke="#8A93B5" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="800" y="412" font-size="10.5" fill="#55608A">fastlane beta</text>

  <text x="40" y="536" font-size="12" fill="#55608A">Client ↔ backend over HTTPS with an Ed25519-signed config; the client is offline-first (falls back locally).</text>
  <text x="40" y="556" font-size="12" fill="#55608A">Every user-facing feature is A/B-toggleable (FeatureFlags + deterministic Bucket). Safety (Crisis) is never experimented on.</text>
</svg>
